name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Generate Prisma client
        run: npx prisma generate
      - name: Type check
        run: npx tsc --noEmit
      - name: Build
        run: npm run build
        env:
          DATABASE_URL: "postgresql://postgres:postgres@db:5432/promptly"
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: "pk_test_build"
          NEXT_PUBLIC_APP_URL: "http://app-host:3000"
