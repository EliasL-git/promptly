# Render Blueprint — Promptly
# Deploys the Next.js app (web service) + managed PostgreSQL.
# https://render.com/docs/blueprint-spec
services:
  - type: web
    name: promptly
    runtime: node
    plan: starter
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: promptly-db
          property: connectionString
      - key: CLERK_SECRET_KEY
        sync: false
      - key: NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY
        sync: false
      - key: S3_ENDPOINT
        sync: false
      - key: S3_REGION
        value: auto
      - key: S3_BUCKET
        sync: false
      - key: S3_ACCESS_KEY
        sync: false
      - key: S3_SECRET_KEY
        sync: false
      - key: S3_PUBLIC_URL
        sync: false
      - key: MODAL_API_KEY
        sync: false
      - key: MODAL_API_URL
        value: https://api.modal.com/v1
      - key: MODAL_ENV_ID
        sync: false
      - key: MODAL_APP_NAME
        sync: false
      - key: MODAL_FUNCTION_NAME
        sync: false
      - key: MODAL_AUTH_RELAY_SECRET
        sync: false
      - key: NEXT_PUBLIC_APP_URL
        sync: false

databases:
  - name: promptly-db
    plan: basic
    databaseName: promptly
    user: promptly
